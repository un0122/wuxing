        tailwind.config = {
            theme: {

                    colors: {

            margin-bottom: 0.5em;
            font-weight: bold;
            font-family: 'Noto Serif SC', serif;

        .markdown-body h2 { font-size: 1.25rem; }
        .markdown-body h3 { font-size: 1.125rem; }

        .markdown-body ul { list-style-type: none; padding-left: 1.5em; margin-bottom: 1em; }
        .markdown-body ul li::before { content: "•"; color: #8c4a3b; display: inline-block; width: 1em; margin-left: -1em; }
        .markdown-body li { margin-bottom: 0.25em; }

            padding-left: 1em; 
            color: #5c4d47;

            margin: 1em 0; 
            padding: 0.8em 1em; 
            border-radius: 0 4px 4px 0;

        .markdown-body hr {
            height: 1px;
            background-color: #d4c4b7;
            border: none;
            margin: 2em 0;
            position: relative;
        }
        .markdown-body hr::after {
            content: '☯';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            padding: 0 10px;
            color: #8c4a3b;

        }
        
        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }

            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid #8c4a3b;
            opacity: 0.3;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen py-10 px-4 sm:px-6 lg:px-8 font-sans">

                        <span class="absolute w-0 h-0 transition-all duration-500 ease-out bg-white rounded-full group-hover:w-56 group-hover:h-56 opacity-10"></span>

            <!-- Loading State -->

                <!-- 八卦旋转动画 -->

            <!-- Results Container -->
            <div id="resultContainer" class="hidden space-y-12">
                <!-- Radar Chart -->
                <div class="relative py-8">
                    <div class="flex items-center justify-center mb-8 relative z-10">

                        <h2 class="text-2xl font-bold text-earth-800 px-6 font-cursive tracking-widest">五行力量分布</h2>

                    <!-- 图表容器，增加国风边框和背景图 -->
                    <div class="chinese-border bg-white p-2 relative overflow-hidden h-96 sm:h-[500px]">
                        <!-- 冥想人物底图 -->
                        <div class="absolute inset-0 z-0 flex items-center justify-center opacity-60 pointer-events-none">
                            <img src="./jimeng-2026-03-22-2511-删除图片中的文字、英文以及五角星、圆形等所有图形元素，保留底图中冥想的人物和原有....png" alt="Meditation Background" class="w-full h-full object-cover" />
                        </div>
                        <div id="radarChart" class="w-full h-full relative z-10"></div>
                    </div>
                </div>

                <!-- Report Text -->
                <div class="relative py-8">
                    <div class="flex items-center justify-center mb-8">
                        <div class="h-px bg-earth-400 flex-1"></div>
                        <h2 class="text-2xl font-bold text-earth-800 px-6 font-cursive tracking-widest">命理深度解析</h2>
                        <div class="h-px bg-earth-400 flex-1"></div>
                    </div>
                    <div class="chinese-border bg-white bg-opacity-70 p-2">
                        <div id="reportContent" class="markdown-body text-earth-900 p-6 sm:p-8"></div>
                    </div>
                </div>
            </div>

    <script>
        // Initialize ECharts instance
        let chartInstance = null;

        function initChart(weights) {
            const chartDom = document.getElementById('radarChart');
            
            // Dispose previous instance if exists to prevent memory leaks or rendering issues
            if (chartInstance) {
                chartInstance.dispose();
            }
            
            chartInstance = echarts.init(chartDom);

            const w = weights || { '金': 0, '木': 0, '水': 0, '火': 0, '土': 0 };
            const total = (w['金'] || 0) + (w['木'] || 0) + (w['水'] || 0) + (w['火'] || 0) + (w['土'] || 0) || 1; // avoid /0
            const getP = (v) => Math.round(((v || 0) / total) * 100) + '%';

            // Coordinates for pentagon (radius adapt to screen)
            const width = chartDom.clientWidth;
            const height = chartDom.clientHeight;
            const minDim = Math.min(width, height);
            const R = minDim * 0.35; // 动态半径
            const symbolSize = Math.max(50, minDim * 0.15); // 动态节点大小

            const nodes = [
                {
                    name: '火', x: 0, y: -R,
                    value: w['火'], percent: getP(w['火']),
                    itemStyle: { color: '#fff0f0', borderColor: '#ffccc7', borderWidth: 2 },
                    label: { color: '#cf1322' }
                },
                {
                    name: '土', x: R * Math.sin(72 * Math.PI / 180), y: -R * Math.cos(72 * Math.PI / 180),
                    value: w['土'], percent: getP(w['土']),
                    itemStyle: { color: '#fff2e8', borderColor: '#ffd8bf', borderWidth: 2 },
                    label: { color: '#d46b08' }
                },
                {
                    name: '金', x: R * Math.sin(144 * Math.PI / 180), y: -R * Math.cos(144 * Math.PI / 180),
                    value: w['金'], percent: getP(w['金']),
                    itemStyle: { color: '#fffbe6', borderColor: '#ffe58f', borderWidth: 2 },
                    label: { color: '#d48806' }
                },
                {
                    name: '水', x: -R * Math.sin(144 * Math.PI / 180), y: -R * Math.cos(144 * Math.PI / 180),
                    value: w['水'], percent: getP(w['水']),
                    itemStyle: { color: '#e6f4ff', borderColor: '#91caff', borderWidth: 2 },
                    label: { color: '#0958d9' }
                },
                {
                    name: '木', x: -R * Math.sin(72 * Math.PI / 180), y: -R * Math.cos(72 * Math.PI / 180),
                    value: w['木'], percent: getP(w['木']),
                    itemStyle: { color: '#f6ffed', borderColor: '#b7eb8f', borderWidth: 2 },
                    label: { color: '#389e0d' }
                }
            ];

            const option = {
                animationDurationUpdate: 1500,
                animationEasingUpdate: 'quinticInOut',
                tooltip: {
                    formatter: function(params) {
                        if (params.dataType === 'node') {
                            return `<div style="font-family: 'Noto Serif SC', serif; font-weight:bold;margin-bottom:5px;border-bottom:1px solid #d4c4b7;padding-bottom:5px;">五行气数</div>
                                    ${params.data.name}: ${params.data.value} (${params.data.percent})`;
                        }
                        return `<div style="font-family: 'Noto Serif SC', serif;">${params.data.source} ${params.data.value} ${params.data.target}</div>`;
                    },
                    backgroundColor: 'rgba(244, 240, 230, 0.95)', // 宣纸色背景
                    borderColor: '#8c4a3b', // 朱砂红边框
                    borderWidth: 1,
                    textStyle: { color: '#3b2e2a' } // 深墨色文字
                },
                graphic: {
                    elements: [
                        {
                            type: 'circle',
                            left: 'center',
                            top: 'center',
                            shape: { r: R * 1.3 }, // 背景圆自适应半径
                            style: {
                                fill: 'rgba(212, 196, 183, 0.1)', // 浅色底
                                stroke: '#d4c4b7', // 古典边框色
                                lineWidth: 1,
                                lineDash: [5, 5]
                            },
                            z: -1
                        }
                    ]
                },
                series: [
                    {
                        type: 'graph',
                        layout: 'none',
                        data: nodes,
                        symbolSize: symbolSize, // 自适应节点大小
                        roam: false,
                        label: {
                            show: true,
                            position: 'inside',
                            formatter: function(params) {
                                return `{title|${params.data.name}}\n{percent|${params.data.percent}}`;
                            },
                            rich: {
                                title: { fontSize: 20, fontFamily: '"Ma Shan Zheng", cursive', fontWeight: 'bold', lineHeight: 22, color: '#3b2e2a' },
                                percent: { fontSize: 12, color: '#5c4d47', fontFamily: '"Noto Serif SC", serif' }
                            }
                        },
                        edgeSymbol: ['none', 'arrow'],
                        edgeSymbolSize: [0, 8],
                        edgeLabel: {
                            show: true,
                            fontSize: 12,
                            fontFamily: '"Noto Serif SC", serif',
                            color: '#8c4a3b', // 朱砂红
                            formatter: '{c}',
                            backgroundColor: 'transparent',
                            padding: [0, 0],
                        },
                        lineStyle: {
                            color: '#b59c8a', // 连线颜色
                            width: 1.5,
                            curveness: 0
                        },
                        links: [
                        // 生 (相生) - outer circle
                        { source: '木', target: '火', value: '木生火', lineStyle: { curveness: 0.2, color: '#8c4a3b', type: 'dashed' } }, // 火红
                        { source: '火', target: '土', value: '火生土', lineStyle: { curveness: 0.2, color: '#947a66', type: 'dashed' } }, // 土黄
                        { source: '土', target: '金', value: '土生金', lineStyle: { curveness: 0.2, color: '#d4c4b7', type: 'dashed' } }, // 金色(浅)
                        { source: '金', target: '水', value: '金生水', lineStyle: { curveness: 0.2, color: '#5c4d47', type: 'dashed' } }, // 水黑
                        { source: '水', target: '木', value: '水生木', lineStyle: { curveness: 0.2, color: '#733b2e', type: 'dashed' } }, // 木青(偏暗)
                        // 克 (相克) - inner star
                        { source: '木', target: '土', value: '木克土', lineStyle: { curveness: 0, color: '#3b2e2a', opacity: 0.6 } },
                        { source: '土', target: '水', value: '土克水', lineStyle: { curveness: 0, color: '#3b2e2a', opacity: 0.6 } },
                        { source: '水', target: '火', value: '水克火', lineStyle: { curveness: 0, color: '#3b2e2a', opacity: 0.6 } },
                        { source: '火', target: '金', value: '火克金', lineStyle: { curveness: 0, color: '#3b2e2a', opacity: 0.6 } },
                        { source: '金', target: '木', value: '金克木', lineStyle: { curveness: 0, color: '#3b2e2a', opacity: 0.6 } }
                        ]
                    }
                ]
            };

            chartInstance.setOption(option);
        }

        // Handle window resize
        window.addEventListener('resize', function() {
            if (chartInstance) {
                chartInstance.resize();
            }
        });

        async function callDifyAPI(inputsParams) {
            const url = '/api/chat'; // 使用 Cloudflare Pages Function 代理
            const headers = {
                'Content-Type': 'application/json'
                // Authorization 头由 Cloudflare Pages Function 在后端添加，前端不再暴露 API Key
            };
            const body = JSON.stringify({
                "inputs": inputsParams,
                "query": "生成报告",
                "response_mode": "blocking",
                "user": "web-user"
            });

            const response = await fetch(url, {
                method: 'POST',
                headers: headers,
                body: body
            });

            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }

            const result = await response.json();
            
            // Check if answer exists and can be parsed
            if (!result.answer) {
                throw new Error('No answer in response');
            }
            
            return JSON.parse(result.answer);
        }

        async function generateReport() {
            const phoneNumber = document.getElementById('phone_number').value.trim();
            
            // 校验：必须只包含数字，且长度至少为5（大于等于5，即不能少于5个数字，你前面说大于5位，这里设定为至少5位。如果必须大于5，就改成 > 5 或者 >= 6。这里按照你的最新要求"5个及以上的阿拉伯数字"即 >= 5）
            // 采用正则匹配：只允许 0-9，且至少5位
            const phoneRegex = /^\d{5,}$/;
            if (!phoneRegex.test(phoneNumber)) {
                alert('请输入有效的联系电话（必须全为阿拉伯数字，且至少5位数）');
                return;
            }

            const inputsParams = {
                bir_year: document.getElementById('bir_year').value.trim(),
                bir_month: document.getElementById('bir_month').value.trim(),
                bir_day: document.getElementById('bir_day').value.trim(),
                gender: document.getElementById('gender').value,
                birth_hour: document.getElementById('birth_hour').value, // 现在是下拉框
                qu_number: document.getElementById('qu_number').value.trim(),
                phone_number: phoneNumber,
                email: document.getElementById('email').value.trim() || ""
            };

            // Hide results, show loading
            document.getElementById('resultContainer').classList.add('hidden');
            const loadingState = document.getElementById('loadingState');
            loadingState.classList.remove('hidden');
            loadingState.classList.add('flex');
            
            // Disable button
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');

            try {
                // Show results FIRST so ECharts can calculate correct dimensions
                document.getElementById('resultContainer').classList.remove('hidden');

                // Try to fetch real data
                const data = await callDifyAPI(inputsParams);

                // Verify data structure
                if (data && data.weights && data.report_data && data.report_data.report_text) {
                    // Render chart
                    initChart(data.weights);
                    
                    // Render markdown
                    // 替换 Markdown 中的网络图片为您本地的图片 (如果需要的话，也可以保持网络图片)
                    let mdText = data.report_data.report_text;
                    const reportHtml = marked.parse(mdText);
                    document.getElementById('reportContent').innerHTML = reportHtml;
                    
                    // Show results
                    // document.getElementById('resultContainer').classList.remove('hidden'); // Already shown above
                    
                    // Scroll to results
                    setTimeout(() => {
                        document.getElementById('resultContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                } else {
                    throw new Error('API 返回的数据格式不正确');
                }
            } catch (error) {
                console.error('生成报告时发生未知错误:', error);
                alert(`生成报告时发生错误：${error.message}\n请检查您的网络连接或稍后重试。`);
            } finally {
                // Hide loading, enable button
                loadingState.classList.add('hidden');
                loadingState.classList.remove('flex');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }
    </script>
